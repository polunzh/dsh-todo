<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dsh-todo · 详情保存按钮</title>
  <style>
    :root { --bg:#f5f5f7; --surface:#fff; --line:#e8e8ee; --ink:#1d1d25; --muted:#8d8d99; --subtle:#5f606b; --violet:#5a49cf; --violet-dark:#4939ba; --violet-tint:#f0effc; --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",Arial,sans-serif; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; overflow:hidden; font-family:var(--font); background:var(--bg); color:var(--ink); letter-spacing:-.012em; }
    .app { height:100vh; display:grid; grid-template-columns:230px 1fr; background:#fafafb; }
    .rail { border-right:1px solid var(--line); padding:25px 14px; background:#fcfcfd; }
    .brand { font-size:18px; font-weight:750; padding:0 9px 26px; } .nav-label { font-size:11px; color:#a0a0aa; letter-spacing:.08em; padding:0 9px 8px; font-weight:700; }
    .nav { display:flex; gap:3px; flex-direction:column; } .nav div { height:35px; padding:0 10px; display:flex; align-items:center; border-radius:7px; color:var(--subtle); font-size:13px; } .nav .active { background:var(--violet-tint); color:var(--violet-dark); font-weight:650; }
    .main { padding:37px 55px; } .top { display:flex; justify-content:space-between; align-items:start; } h1 { margin:0; font-size:27px; letter-spacing:-.035em; } .date { margin-top:7px; color:var(--muted); font-size:13px; }
    .add { margin:36px auto 25px; max-width:850px; height:68px; border:1px solid #e4e1fb; border-radius:12px; background:#fff; display:flex; align-items:center; padding:0 16px; box-shadow:0 4px 20px rgba(31,22,90,.04); color:#a0a0aa; } .plus { font-size:26px; color:var(--violet); margin-right:11px; }
    .section { max-width:850px; margin:0 auto; color:var(--muted); font-size:12px; font-weight:650; } .task { padding:18px 16px; border-bottom:1px solid #ededf1; display:flex; align-items:center; gap:13px; background:#fff; } .check { width:25px; height:25px; border:2px solid #dadbe2; border-radius:50%; } .task-title { font-size:15px; font-weight:620; flex:1; } .task-meta { color:#a1a1aa; font-size:12px; margin-top:4px; } .prio { font-size:11px; color:#df4b4b; font-weight:700; }
    .veil { position:fixed; inset:0 0 0 230px; background:rgba(23,22,32,.13); backdrop-filter:blur(1px); }
    .drawer { position:fixed; right:0; top:0; width:min(470px,100vw); height:100vh; display:flex; flex-direction:column; background:var(--surface); box-shadow:-14px 0 38px rgba(16,16,28,.11); }
    .head { height:88px; padding:0 26px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:13px; } .head-title { font-size:18px; font-weight:730; margin-right:auto; } .save-state { color:#9a8de4; font-size:12px; font-weight:600; white-space:nowrap; }
    button { font:inherit; cursor:pointer; } .save { height:34px; border:0; border-radius:8px; padding:0 14px; color:#fff; background:var(--violet); box-shadow:0 2px 6px rgba(90,73,207,.28); font-size:13px; font-weight:680; } .close { margin-left:1px; width:33px; height:33px; border:0; border-radius:7px; background:transparent; color:#53545f; font-size:22px; line-height:1; }
    .body { flex:1; overflow:hidden; padding:27px 27px 20px; } .field { margin-bottom:22px; } label { display:block; color:#70717b; font-weight:650; font-size:12px; margin-bottom:8px; } input, textarea, .select { font:inherit; color:var(--ink); width:100%; border:1px solid #e7e7ec; border-radius:8px; background:#fff; padding:10px 12px; outline:none; } input { height:43px; font-size:15px; font-weight:600; } textarea { height:134px; resize:none; font-size:14px; color:#686973; line-height:1.55; } .row { display:grid; grid-template-columns:1fr 1fr; gap:14px; } .select { color:#464751; font-size:14px; height:42px; } .priority { display:flex; gap:7px; } .priority span { min-width:42px; padding:7px 9px; text-align:center; border:1px solid #e7e7ec; border-radius:7px; font-size:13px; } .priority .selected { color:var(--violet); border-color:#c6beff; background:var(--violet-tint); font-weight:700; }
    .foot { height:86px; border-top:1px solid var(--line); padding:0 27px; display:flex; align-items:center; justify-content:space-between; color:#a0a1aa; font-size:12px; } .delete { border:1px solid #f1bebe; color:#c84242; background:#fff; border-radius:8px; height:34px; padding:0 12px; font-size:13px; }
    .callout { position:absolute; right:500px; top:105px; width:220px; padding:13px 15px; background:#262334; color:#fff; border-radius:10px; font-size:12px; line-height:1.5; box-shadow:0 8px 30px rgba(25,20,43,.23); } .callout:after { content:""; position:absolute; right:-8px; top:24px; border:8px solid transparent; border-left-color:#262334; border-right:0; } .callout strong { display:block; font-size:13px; margin-bottom:3px; } .callout em { color:#c9c2ff; font-style:normal; }
    @media (max-width:760px) { .app { grid-template-columns:1fr; } .rail,.veil { display:none; } .main { padding:25px 18px; } .drawer { width:100%; } .callout { display:none; } .head { padding:0 18px; } .body { padding:22px 18px; } .foot { padding:0 18px; } }
  </style>
</head>
<body>
  <div class="app"><aside class="rail"><div class="brand">待办</div><div class="nav-label">视图</div><nav class="nav"><div class="active">▣　今天</div><div>◷　即将到来</div><div>▤　收件箱</div><div>✓　已完成</div></nav></aside><main class="main"><div class="top"><div><h1>今天</h1><div class="date">2026 · 11 月 24 日 · 周二</div></div></div><div class="add"><span class="plus">＋</span>添加任务：明天 15:00 写周报 #工作 !p1</div><div class="section">逾期　7</div><div class="task"><span class="check"></span><div><div class="task-title">多邻国</div><div class="task-meta">◷ 昨天　↻ 每天</div></div><span class="prio">P1</span></div><div class="task"><span class="check"></span><div><div class="task-title">不背单词</div><div class="task-meta">◷ 11 月 22 日　↻ 每天</div></div><span class="prio">P2</span></div></main></div>
  <div class="veil"></div><aside class="drawer" role="dialog" aria-label="任务详情"><header class="head"><strong class="head-title">任务详情</strong><span class="save-state">有未保存修改</span><button class="save">保存</button><button class="close" aria-label="关闭">×</button></header><div class="body"><div class="field"><label>标题</label><input value="读一些新出的文章或论文" readonly /></div><div class="field"><label>备注</label><textarea readonly>补充说明、链接、验收标准…</textarea></div><div class="field row"><div><label>截止时间</label><div class="select">yyyy/mm/dd　⌄</div></div><div><label>&nbsp;</label><div class="select">--:--　◷</div></div></div><div class="field"><label>优先级</label><div class="priority"><span>无</span><span>P0</span><span class="selected">P1</span><span>P2</span><span>P3</span><span>P4</span></div></div><div class="field"><label>项目</label><div class="select">收件箱　⌄</div></div><div class="field"><label>标签</label><input placeholder="用逗号分隔，如：工作，汇报" readonly /></div></div><footer class="foot"><span>自动保存已开启</span><button class="delete">⌫　删除任务</button></footer></aside><div class="callout"><strong>明确提交，持续保护</strong>字段有变更时主按钮可用；<em>自动保存仍在后台工作</em>，两条路径共享同一提交队列。</div>
</body>
</html>
