  <style>
    :root{--page:#f7f7f9;--side:#fcfcfd;--surface:#fff;--ink:#20212a;--sub:#62636e;--muted:#92939d;--line:#e8e8ed;--violet:#4f46e5;--violet-tint:#efefff;--green:#49bd79;--toast:#28263c;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);letter-spacing:-.012em;min-height:100vh}.app{min-height:100vh;display:grid;grid-template-columns:238px 1fr}.side{background:var(--side);border-right:1px solid var(--line);padding:24px 14px}.brand{padding:5px 10px 28px;font-size:19px;font-weight:760}.label{padding:0 10px 8px;color:#a0a0aa;font-size:10.5px;font-weight:750;letter-spacing:.1em}.nav{display:grid;gap:3px}.nav div{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;color:var(--sub);font-size:13px}.nav .active{color:#4038ca;background:var(--violet-tint);font-weight:700}.main{padding:43px 64px}.header{display:flex;align-items:start;justify-content:space-between;max-width:900px;margin:auto}.header h1{margin:0;font-size:28px;letter-spacing:-.035em}.date{margin-top:7px;color:var(--muted);font-size:13px}.progress{padding:8px 11px;border:1px solid #deddf5;border-radius:8px;color:#5751c6;background:#fbfbff;font-size:12px;font-weight:650}.quick{max-width:900px;height:69px;margin:34px auto 25px;display:flex;align-items:center;gap:12px;padding:0 17px;border:1px solid #dfdef7;border-radius:12px;background:#fff;color:#9b9ba4;box-shadow:0 5px 20px rgba(37,29,100,.045);font-size:14px}.quick svg{color:var(--violet)}.group{max-width:900px;margin:0 auto;color:var(--sub);font-size:12px;font-weight:720}.list{max-width:900px;margin:8px auto;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.task{min-height:72px;display:flex;align-items:center;gap:13px;padding:0 17px;border-bottom:1px solid #ededef}.task:last-child{border-bottom:0}.task.is-leaving{opacity:.42;background:#fbfffd;transform:scale(.994)}.tick{width:25px;height:25px;border:2px solid #dadbe1;border-radius:50%;display:grid;place-items:center;flex:none}.is-leaving .tick{border-color:var(--green);background:var(--green);color:#fff}.task-copy{flex:1}.task-title{font-size:14.5px;font-weight:650}.is-leaving .task-title{text-decoration:line-through;color:#83848d}.task-meta{margin-top:5px;font-size:12px;color:#999aa3}.priority{font-size:11px;font-weight:750;color:#dc4d4d}.fade{position:fixed;inset:0;background:rgba(244,244,248,.18);pointer-events:none}.toast{position:fixed;z-index:2;left:50%;bottom:28px;transform:translateX(-50%);width:min(540px,calc(100vw - 32px));min-height:76px;display:flex;align-items:center;gap:13px;padding:12px 13px 12px 15px;border-radius:12px;background:var(--toast);color:#fff;box-shadow:0 16px 35px rgba(27,24,48,.28)}.mark{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;background:#b8f1d1;color:#1d4a34}.text{min-width:0;flex:1}.text strong{display:block;font-size:13.5px;letter-spacing:0}.text span{display:block;overflow:hidden;margin-top:3px;color:#d6d4e4;font-size:12px;white-space:nowrap;text-overflow:ellipsis}.undo{height:36px;border:1px solid rgba(255,255,255,.34);border-radius:8px;padding:0 13px;background:#fff;color:#38324f;font-size:12.5px;font-weight:740}.undo:hover{background:#f1f0ff}.close{width:30px;height:30px;border:0;border-radius:7px;background:transparent;color:#cfccdc}.callout{position:fixed;left:calc(50% + 305px);bottom:127px;width:205px;padding:13px 15px;border-radius:10px;background:#28263c;color:#fff;box-shadow:0 9px 24px rgba(30,26,52,.18);font-size:12px;line-height:1.5}.callout:after{content:"";position:absolute;bottom:-7px;left:28px;border:7px solid transparent;border-top-color:#28263c;border-bottom:0}.callout strong{display:block;margin-bottom:3px;font-size:13px}.callout em{color:#bdb9ff;font-style:normal}@media(max-width:760px){.app{grid-template-columns:1fr}.side{display:none}.main{padding:25px 16px}.toast{bottom:16px}.callout{display:none}.header h1{font-size:24px}.progress{display:none}}
  </style>
</head>
