      * { box-sizing: border-box; }

        flex-direction: column;
        gap: 6px;

        border-radius: var(--dsw-radius-lg);
        background: var(--dsw-alias-bg-layer-2);

        display: flex;
        flex-direction: column;

      .pv-composer-row { display: flex; align-items: center; gap: 8px; }
      .pv-composer-chip {

        color: var(--dsw-alias-label-secondary);
        border: 1px solid var(--dsw-alias-border-l1);
        border-radius: var(--dsw-radius-sm);
        padding: 2px 8px;
      }
      .pv-composer-send {
        margin-left: auto;
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: var(--dsw-alias-label-primary);
        color: var(--dsw-alias-bg-base);
        font-size: 14px;
      }
      /* 收起状态的侧边栏（图标轨），用来展示图标上的番茄分钟角标 */
      #rail {
        display: none;
        flex: none;
        width: 56px;
        height: 100%;
        flex-direction: column;

      body[data-mode="rail"] #rail { display: flex; }
      body[data-mode="rail"] #main-mount { display: none; }
      body[data-mode="rail"] #chat-shell { display: flex; }
      .pv-rail-btn {
        display: grid; place-items: center;
        width: 36px; height: 36px; padding: 0;
        border: none; border-radius: var(--dsw-radius-md);
        background: transparent; color: var(--dsw-alias-label-tertiary);

      #dock-mount {

        position: fixed;
        bottom: 8px;
        right: 8px;
        z-index: 99999;

      const targetView = params.get("view") || "today";

      const mode =
        rawMode === "dock" ? "dock" : rawMode === "rail" ? "rail" : rawMode === "sidebar" ? "sidebar" : "panel";
      if (mode !== "panel") document.body.setAttribute("data-mode", mode);
      if (params.get("debug") === "1") document.body.setAttribute("data-debug", "1");

      /* 会话截图需要一个正在跑的番茄钟：先写 localStorage，客户端启动时会读它。 */
      if (params.get("pom") === "running") {
        const remaining = 18 * 60000 + 42000;
        try {
          window.localStorage.setItem(
            "dsh-todo/pomodoro",
            JSON.stringify({
              mode: "focus",
              endsAt: Date.now() + remaining,
              remainingMs: remaining,
              running: true,
              taskId: "t-01",
              cycle: 1,

      }
      if (isDark) {
        document.body.setAttribute("data-ds-dark-theme", "");

        {
          id: "t-08",
          title: targetLocale === "en" ? "Refactor store atomicity test fixtures" : "重构存储层原子写入的测试用例",
          note: "",
          due: { date: todayDate, time: "11:00" },
          priority: 2,
          projectId: "p-work",
          labels: [],
          parentId: null,
          recurrence: null,
          done: true,
          doneAt: now - 3600000,
          createdAt: now - 86400000,
          updatedAt: now - 3600000,
          order: 70,
          pomodoros: 2,
        },
      ];

      const seedSessions = [
        { id: "s-1", taskId: "t-01", kind: "focus", startedAt: now - 3600000 * 3, endedAt: now - 3600000 * 2.5, minutes: 25 },
        { id: "s-2", taskId: "t-01", kind: "focus", startedAt: now - 3600000 * 2, endedAt: now - 3600000 * 1.5, minutes: 25 },
        { id: "s-3", taskId: "t-08", kind: "focus", startedAt: now - 3600000 * 1.3, endedAt: now - 3600000 * 0.8, minutes: 25 },
        { id: "s-4", taskId: "t-02", kind: "focus", startedAt: now - 86400000 - 3600000 * 2, endedAt: now - 86400000 - 3600000 * 1.5, minutes: 25 },
        { id: "s-5", taskId: "t-03", kind: "focus", startedAt: now - 86400000 * 2 - 3600000 * 3, endedAt: now - 86400000 * 2 - 3600000 * 2.5, minutes: 25 },
      ];

      const mockDb = {
        version: 1,
        tasks: JSON.parse(JSON.stringify(seedTasks)),
        projects: JSON.parse(JSON.stringify(seedProjects)),
        sessions: JSON.parse(JSON.stringify(seedSessions)),
        settings: {
          focusMinutes: 25,
          shortBreakMinutes: 5,
          longBreakMinutes: 15,
          longBreakEvery: 4,
          autoStartNext: false,
          sound: true,
          dailyGoal: 8,
        },
      };

      /* ------------------------------------------------------------------ */
      /* Mock window.fetch for /todo/api/*                                  */
      /* ------------------------------------------------------------------ */
      const realFetch = window.fetch.bind(window);
      window.fetch = async function (input, init) {
        const urlStr = typeof input === "string" ? input : input?.url || "";
        if (!urlStr.includes("todo/api")) {
          return realFetch(input, init);
        }
        const method = (init?.method || "GET").toUpperCase();
        let pathname = "";
        try {
          pathname = new URL(urlStr, window.location.href).pathname.replace(/\/+$/, "");
        } catch {
          pathname = urlStr;
        }
        const route = pathname.replace(/^.*\/todo\/api\/?/, "");

        const readBody = () => {
          if (!init?.body) return {};
          try {
            return JSON.parse(init.body);
          } catch {
            return {};
          }
        };

        const json = (data, status = 200) => {
          return new Response(JSON.stringify(data), {
            status,
            headers: { "Content-Type": "application/json; charset=utf-8" },
          });
        };

        if (route === "health" && method === "GET") {
          return json({ ok: true, plugin: "dsh-todo", limits: { tasks: 5000, projects: 100, sessions: 10000 } });
        }
        if (route === "state" && method === "GET") {
          return json({
            ok: true,
            state: JSON.parse(JSON.stringify(mockDb)),
            today: todayDate,
            serverNow: Date.now(),
          });
        }
        if (route === "tasks/create" && method === "POST") {
          const body = readBody();
          const task = {
            id: "t-" + Math.random().toString(36).slice(2, 9),
            title: String(body.title || "").trim(),
            note: String(body.note || ""),
            due: body.due || null,
            priority: body.priority || null,
            projectId: body.projectId || null,
            labels: Array.isArray(body.labels) ? body.labels : [],
            parentId: body.parentId || null,
            recurrence: body.recurrence || null,
            done: false,
            doneAt: null,
            createdAt: Date.now(),
            updatedAt: Date.now(),
            order: (mockDb.tasks.length + 1) * 10,
            pomodoros: 0,
          };
          mockDb.tasks.unshift(task);
          return json({ ok: true, task }, 201);
        }
        if (route === "tasks/update" && method === "POST") {
          const body = readBody();
          const idx = mockDb.tasks.findIndex((t) => t.id === body.id);
          if (idx === -1) return json({ ok: false, error: "not-found", message: "Task not found" }, 404);
          const current = mockDb.tasks[idx];
          const updated = {
            ...current,
            ...body,
            updatedAt: Date.now(),
          };
          mockDb.tasks[idx] = updated;
          return json({ ok: true, task: updated });
        }
        if (route === "tasks/toggle" && method === "POST") {
          const body = readBody();
          const idx = mockDb.tasks.findIndex((t) => t.id === body.id);
          if (idx === -1) return json({ ok: false, error: "not-found" }, 404);
          const current = mockDb.tasks[idx];
          const nextDone = body.done !== undefined ? Boolean(body.done) : !current.done;
          current.done = nextDone;
          current.doneAt = nextDone ? Date.now() : null;
          current.updatedAt = Date.now();
          return json({ ok: true, task: current });
        }
        if (route === "tasks/delete" && method === "POST") {
          const body = readBody();
          const removed = [];
          const keep = [];
          for (const t of mockDb.tasks) {
            if (t.id === body.id || t.parentId === body.id) removed.push(t);
            else keep.push(t);
          }
          mockDb.tasks = keep;
          return json({ ok: true, tasks: removed });
        }
        if (route === "tasks/restore" && method === "POST") {
          const body = readBody();
          const list = Array.isArray(body.tasks) ? body.tasks : [];
          for (const t of list) {
            if (!mockDb.tasks.some((x) => x.id === t.id)) mockDb.tasks.push(t);
          }
          return json({ ok: true, tasks: list });
        }
        if (route === "tasks/move" && method === "POST") {
          return json({ ok: true, tasks: mockDb.tasks });
        }
        if (route === "projects/create" && method === "POST") {
          const body = readBody();
          const project = {
            id: "p-" + Math.random().toString(36).slice(2, 9),
            name: String(body.name || "Project").trim(),
            color: body.color || "tomato",
            order: mockDb.projects.length,
            createdAt: Date.now(),
          };
          mockDb.projects.push(project);
          return json({ ok: true, project }, 201);
        }
        if (route === "projects/update" && method === "POST") {
          const body = readBody();
          const p = mockDb.projects.find((x) => x.id === body.id);
          if (!p) return json({ ok: false, error: "not-found" }, 404);
          if (body.name !== undefined) p.name = body.name;
          if (body.color !== undefined) p.color = body.color;
          return json({ ok: true, project: p });
        }
        if (route === "projects/delete" && method === "POST") {
          const body = readBody();
          mockDb.projects = mockDb.projects.filter((x) => x.id !== body.id);
          for (const t of mockDb.tasks) {
            if (t.projectId === body.id) t.projectId = null;
          }
          return json({ ok: true, deletedTasks: [] });
        }
        if (route === "settings" && method === "POST") {
          const body = readBody();
          Object.assign(mockDb.settings, body);
          return json({ ok: true, settings: mockDb.settings });
        }
        if (route === "sessions/record" && method === "POST") {
          const body = readBody();
          const session = {
            id: "s-" + Math.random().toString(36).slice(2, 9),
            taskId: body.taskId || null,
            kind: "focus",
            startedAt: Number(body.startedAt) || Date.now() - 25 * 60000,
            endedAt: Number(body.endedAt) || Date.now(),
            minutes: Number(body.minutes) || 25,
          };
          mockDb.sessions.push(session);
          let targetTask = null;
          if (session.taskId) {
            targetTask = mockDb.tasks.find((t) => t.id === session.taskId);
            if (targetTask) targetTask.pomodoros = (targetTask.pomodoros || 0) + 1;
          }
          return json({ ok: true, session, task: targetTask });
        }

        return json({ ok: false, error: "not-found", route }, 404);
      };

      /* ------------------------------------------------------------------ */
      /* __ModuleLoader__ stub that captures registration                   */
      /* ------------------------------------------------------------------ */
      window.__previewComponent = null;
      window.__previewDock = [];
      window.__previewSidebar = [];
      window.__previewReady = false;

      window.__ModuleLoader__ = {
        load({ id, factory }) {
          try {
            const exports = factory((name) => {
              if (name === "react") return window.React;
              throw new Error("client requested unknown module: " + name);
            });
            window.__previewExports = exports;

            /* Fake context to capture apply registrations */
            const subscribers = new Set();
            const fakeCtx = {
              get(service) {
                if (service === "locale") return this.locale;
                if (service === "slots") return this.slots;
                return undefined;
              },
              locale: {
                getSnapshot() {
                  return { active: targetLocale === "en" ? "en-US" : "zh-CN" };
                },
                getLocale() {
                  return { active: targetLocale === "en" ? "en-US" : "zh-CN" };
                },
                subscribe(fn) {
                  subscribers.add(fn);
                  return () => subscribers.delete(fn);
                },
                register(ns, dicts) {},
                bind(ns) {
                  return (key, vars) => undefined;
                },
              },
              slots: {
                inject(slotKey, callback) {
                  if (typeof callback === "function") callback();
                  return () => {};
                },
                register(options, Component) {
                  if (options.name === "main" || options.key === "dsh-todo") {
                    window.__previewComponent = Component;
                  }
                  if (options.name === "conversation.composer.dock") {
                    window.__previewDock.push(Component);
                  }
                  if (options.name === "sidebar.panellist") {
                    window.__previewSidebar.push(Component);
                  }
                },
              },
              effect(fn, label) {
                try {
                  const cleanup = fn();
                  return typeof cleanup === "function" ? cleanup : () => {};
                } catch {
                  return () => {};
                }
              },
            };

            if (exports && typeof exports.apply === "function") {
              exports.apply(fakeCtx);
            }

            /* Mount the captured component into the visible surface */
            const Component = window.__previewComponent || (exports?.__preview?.TodoPage);
            if (Component) {
              if (mode === "sidebar") {
                const wideRoot = ReactDOM.createRoot(document.getElementById("wide-mount"));
                wideRoot.render(
                  React.createElement(
                    React.Fragment,
                    null,
                    ...window.__previewSidebar.map((Glyph, index) =>
                      React.createElement(Glyph, { key: index, size: 16, active: true }),
                    ),
                  ),
                );
              } else if (mode === "rail") {
                const railTarget = document.getElementById("rail-mount");
                const railRoot = ReactDOM.createRoot(railTarget);
                railRoot.render(
                  React.createElement(
                    React.Fragment,
                    null,
                    ...window.__previewSidebar.map((Glyph, index) =>
                      React.createElement(Glyph, { key: index, size: 18, active: true }),
                    ),
                  ),
                );
                const dockTarget = document.getElementById("dock-mount");
                const dockRoot = ReactDOM.createRoot(dockTarget);
                dockRoot.render(
                  React.createElement(
                    React.Fragment,
                    null,
                    ...window.__previewDock.map((Dock, index) =>
                      React.createElement(Dock, { key: index }),
                    ),
                  ),
                );
              } else if (mode === "dock") {
                const dockTarget = document.getElementById("dock-mount");
                const dockRoot = ReactDOM.createRoot(dockTarget);
                const dockComponents = window.__previewDock;
                dockRoot.render(
                  React.createElement(
                    React.Fragment,
                    null,
                    ...dockComponents.map((Dock, index) =>
                      React.createElement(Dock, { key: index, ctx: fakeCtx }),
                    ),
                  ),
                );
              } else {
                const root = ReactDOM.createRoot(document.getElementById("main-mount"));
                root.render(React.createElement(Component, { ctx: fakeCtx }));
              }
              // Wait for React to mount and dataStore to fetch state
              const checkMounted = () => {
                const mount = mode === "sidebar" ? document.getElementById("wide-mount") :
                  mode === "rail" ? document.getElementById("rail-mount") :
                  mode === "dock" ? document.getElementById("dock-mount") :
                  document.getElementById("main-mount");
                const hasContent = Boolean(
                  mount &&
                    mount.children.length > 0 &&
                    (mode === "rail" || mode === "sidebar" || (mount.innerText || "").trim().length > 4),
                );
                if (hasContent) {
                  window.__previewReady = true;
                  document.documentElement.dataset.ready = "1";
                } else {
                  setTimeout(checkMounted, 50);
                }
              };
              setTimeout(checkMounted, 100);
            } else {
              console.error("no component registered to main slot or exported in __preview");
            }
          } catch (err) {
            console.error("ModuleLoader factory execution failed", err);
            window.__previewLoadError = err;
          }
        },
      };
    </script>
    <script src="../lib/client.js"></script>
  </body>
</html>
